<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" role="img" aria-label="Modelo-Vista-Controlador: cada línea del script de v0 queda en la pieza que le corresponde (datos en el modelo, lógica en el controlador, HTML en la vista), y una petición las recorre: controlador, modelo, controlador y vista" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>Modelo-Vista-Controlador: cada línea del script de v0 queda en la pieza que le corresponde (datos en el modelo, lógica en el controlador, HTML en la vista), y una petición las recorre: controlador, modelo, controlador y vista</title>
  <defs>
    <marker id="m-fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4B5563"/></marker>
    <marker id="m-fl-rosa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#DB2777"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="465" rx="14" fill="#F8FAFC"/>

  <!-- MVC: tres piezas (aparecen al separar) -->
  <g>
    <rect x="570" y="15" width="310" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="585" y="42" font-size="19" font-weight="700" fill="#065F46">Modelo <tspan font-weight="400" font-size="15">· los datos</tspan></text>
    <rect x="570" y="155" width="310" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="585" y="182" font-size="19" font-weight="700" fill="#5B21B6">Controlador <tspan font-weight="400" font-size="15">· coordina</tspan></text>
    <rect x="570" y="295" width="310" height="160" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text x="585" y="322" font-size="19" font-weight="700" fill="#9D174D">Vista <tspan font-weight="400" font-size="15">· la presentación</tspan></text>
  </g>

  <!-- Las líneas del script: viajan a la pieza que les corresponde -->
  <g transform="translate(530 210)">
    <rect x="50" y="130" width="290" height="44" rx="6" fill="#FCE7F3" stroke="#DB2777"/>
    <text x="62" y="157" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#831843">&lt;h1&gt;&lt;?= NOMBRE_CENTRO ?&gt;&lt;/h1&gt;</text>
  </g>
  <g transform="translate(530 -125)">
    <rect x="50" y="185" width="290" height="44" rx="6" fill="#D1FAE5" stroke="#059669"/>
    <text x="62" y="212" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#064E3B">$curriculos = [ … ];</text>
  </g>
  <g transform="translate(530 -45)">
    <rect x="50" y="240" width="290" height="44" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="62" y="267" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">$ciclo = $_GET['ciclo'] ?? '';</text>
  </g>
  <g transform="translate(530 95)">
    <rect x="50" y="295" width="290" height="44" rx="6" fill="#FCE7F3" stroke="#DB2777"/>
    <text x="62" y="322" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#831843">foreach (…) echo '&lt;li&gt;…&lt;/li&gt;';</text>
  </g>

  <!-- El ciclo de una petición -->
  <g>
    <circle cx="150" cy="205" r="22" fill="#3B82F6"/>
    <path d="M112 270 C 112 236, 188 236, 188 270 Z" fill="#3B82F6"/>
    <text x="150" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">Navegador</text>
    <path d="M200 215 L 566 215" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#m-fl-gris)"/>
    <text x="383" y="205" text-anchor="middle" font-size="14" fill="#374151">petición</text>
    <path d="M690 155 L 690 119" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#m-fl-gris)"/>
    <text x="682" y="142" text-anchor="end" font-size="13" fill="#374151">pide</text>
    <path d="M760 115 L 760 151" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#m-fl-gris)"/>
    <text x="768" y="142" font-size="13" fill="#374151">datos</text>
    <path d="M725 255 L 725 291" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#m-fl-gris)"/>
    <text x="733" y="280" font-size="13" fill="#374151">datos</text>
    <path d="M570 430 C 380 430, 230 400, 165 312" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#m-fl-rosa)"/>
    <text x="350" y="440" font-size="14" font-weight="700" fill="#9D174D">HTML</text>
  </g>

</svg>
