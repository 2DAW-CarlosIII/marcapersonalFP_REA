<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="El navegador pide el formulario de alta. Lo envía con el nombre vacío: el Form Request falla, guarda en la sesión los errores y lo escrito, y redirige de vuelta al formulario, que llega relleno y con los mensajes. Lo envía con datos válidos: el controlador deja un mensaje flash en la sesión y redirige al listado, que muestra el mensaje una vez" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>El navegador pide el formulario de alta. Lo envía con el nombre vacío: el Form Request falla, guarda en la sesión los errores y lo escrito, y redirige de vuelta al formulario, que llega relleno y con los mensajes. Lo envía con datos válidos: el controlador deja un mensaje flash en la sesión y redirige al listado, que muestra el mensaje una vez</title>
  <defs>
    <marker id="f-fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4B5563"/></marker>
    <marker id="f-fl-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#2563EB"/></marker>
    <marker id="f-fl-ambar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#D97706"/></marker>
    <marker id="f-fl-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#059669"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="14" fill="#F8FAFC"/>

  <!-- Participantes y líneas de vida -->
  <rect x="45" y="12" width="190" height="44" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">Navegador</text>
  <rect x="360" y="12" width="280" height="44" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="500" y="31" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Laravel</text>
  <text x="500" y="49" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#5B21B6">ProyectosController · ProyectoRequest</text>
  <rect x="745" y="12" width="190" height="44" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="840" y="31" text-anchor="middle" font-size="17" font-weight="700" fill="#065F46">Sesión</text>
  <text x="840" y="49" text-anchor="middle" font-size="12" fill="#065F46">en el servidor</text>
  <path d="M140 56 L 140 462" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M500 56 L 500 462" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M840 56 L 840 462" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 1 · GET el formulario -->
  <g>
    <circle cx="24" cy="80" r="12" fill="#2563EB"/><text x="24" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="320" y="74" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#374151">GET /proyectos/create</text>
    <path d="M140 80 L 496 80" stroke="#4B5563" stroke-width="2.5" marker-end="url(#f-fl-gris)"/>
    <text x="320" y="100" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">200 · formulario con @csrf</text>
    <path d="M500 106 L 144 106" stroke="#2563EB" stroke-width="2.5" marker-end="url(#f-fl-azul)"/>
  </g>
  <!-- 2 · POST no válido: errores y old input, y vuelta atrás -->
  <g>
    <circle cx="24" cy="140" r="12" fill="#DC2626"/><text x="24" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="320" y="134" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#B91C1C">POST /proyectos · nombre vacío</text>
    <path d="M140 140 L 496 140" stroke="#4B5563" stroke-width="2.5" marker-end="url(#f-fl-gris)"/>
    <text x="512" y="145" font-size="13" font-weight="700" fill="#B91C1C">ProyectoRequest ✗</text>
    <text x="670" y="160" text-anchor="middle" font-size="13" fill="#065F46">errores + <tspan font-style="italic">old input</tspan></text>
    <path d="M500 166 L 836 166" stroke="#059669" stroke-width="2.5" marker-end="url(#f-fl-verde)"/>
    <text x="320" y="186" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#B45309">302 · Location: /proyectos/create</text>
    <path d="M500 192 L 144 192" stroke="#D97706" stroke-width="2.5" marker-end="url(#f-fl-ambar)"/>
  </g>
  <!-- 3 · el formulario, relleno y con mensajes -->
  <g>
    <circle cx="24" cy="226" r="12" fill="#2563EB"/><text x="24" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="320" y="220" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#374151">GET /proyectos/create</text>
    <path d="M140 226 L 496 226" stroke="#4B5563" stroke-width="2.5" marker-end="url(#f-fl-gris)"/>
    <text x="670" y="246" text-anchor="middle" font-size="13" fill="#065F46">old() y $errors · y se borran</text>
    <path d="M840 252 L 504 252" stroke="#059669" stroke-width="2.5" marker-end="url(#f-fl-verde)"/>
    <text x="320" y="272" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">200 · formulario relleno + @error</text>
    <path d="M500 278 L 144 278" stroke="#2563EB" stroke-width="2.5" marker-end="url(#f-fl-azul)"/>
  </g>
  <!-- 4 · POST válido: mensaje flash y redirección -->
  <g>
    <circle cx="24" cy="312" r="12" fill="#059669"/><text x="24" y="317" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="320" y="306" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#047857">POST /proyectos · datos válidos</text>
    <path d="M140 312 L 496 312" stroke="#4B5563" stroke-width="2.5" marker-end="url(#f-fl-gris)"/>
    <text x="512" y="317" font-size="13" font-weight="700" fill="#047857">ProyectoRequest ✓</text>
    <text x="670" y="332" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#065F46">with('mensaje', …)</text>
    <path d="M500 338 L 836 338" stroke="#059669" stroke-width="2.5" marker-end="url(#f-fl-verde)"/>
    <text x="320" y="358" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#B45309">302 · Location: /proyectos</text>
    <path d="M500 364 L 144 364" stroke="#D97706" stroke-width="2.5" marker-end="url(#f-fl-ambar)"/>
  </g>
  <!-- 5 · GET el listado, con el mensaje una vez -->
  <g>
    <circle cx="24" cy="398" r="12" fill="#2563EB"/><text x="24" y="403" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="320" y="392" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#374151">GET /proyectos</text>
    <path d="M140 398 L 496 398" stroke="#4B5563" stroke-width="2.5" marker-end="url(#f-fl-gris)"/>
    <text x="670" y="418" text-anchor="middle" font-size="13" fill="#065F46">@session('mensaje') · y se borra</text>
    <path d="M840 424 L 504 424" stroke="#059669" stroke-width="2.5" marker-end="url(#f-fl-verde)"/>
    <text x="320" y="444" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">200 · listado con «Proyecto … creado.»</text>
    <path d="M500 450 L 144 450" stroke="#2563EB" stroke-width="2.5" marker-end="url(#f-fl-azul)"/>
  </g>

</svg>
