<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="El router compara GET /proyectos/show/7 con cada ruta de routes/web.php, en orden: las dos primeras no coinciden, la tercera sí; el 7 pasa a $id y la acción devuelve la respuesta" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>El router compara GET /proyectos/show/7 con cada ruta de routes/web.php, en orden: las dos primeras no coinciden, la tercera sí; el 7 pasa a $id y la acción devuelve la respuesta</title>
  <defs>
    <marker id="r-fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4B5563"/></marker>
    <marker id="r-fl-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#059669"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" rx="14" fill="#F8FAFC"/>

  <!-- routes/web.php -->
  <rect x="340" y="20" width="600" height="262" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="355" y="45" font-size="14" font-weight="700" font-family="'Source Code Pro', Consolas, monospace" fill="#334155">routes/web.php</text>
  <rect x="350" y="58" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="362" y="65" width="46" height="24" rx="5" fill="#2563EB"/><text x="385" y="82" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#fff">GET</text>
  <text x="422" y="83" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#111827">/</text>
  <rect x="350" y="102" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="362" y="109" width="46" height="24" rx="5" fill="#2563EB"/><text x="385" y="126" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#fff">GET</text>
  <text x="422" y="127" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#111827">/proyectos</text>
  <rect x="350" y="146" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="362" y="153" width="46" height="24" rx="5" fill="#2563EB"/><text x="385" y="170" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#fff">GET</text>
  <text x="422" y="171" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#111827">/proyectos/show/{id}</text>
  <text x="700" y="170" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#6B7280">whereNumber('id')</text>
  <rect x="350" y="190" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="362" y="197" width="46" height="24" rx="5" fill="#2563EB"/><text x="385" y="214" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#fff">GET</text>
  <text x="422" y="215" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#111827">/proyectos/create</text>
  <rect x="350" y="234" width="580" height="38" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="362" y="241" width="46" height="24" rx="5" fill="#2563EB"/><text x="385" y="258" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#fff">GET</text>
  <text x="422" y="259" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#111827">/proyectos/edit/{id}</text>
  <text x="700" y="258" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#6B7280">whereNumber('id')</text>

  <!-- 1 · llega la petición -->
  <g>
    <rect x="20" y="40" width="280" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="35" y="62" font-size="13" fill="#1E40AF">Petición</text>
    <text x="35" y="96" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">GET /proyectos/show/7</text>
    <path d="M300 78 L 336 78" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#r-fl-gris)"/>
  </g>
  <!-- 2 · las compara en orden -->
  <g>
    <text x="22" y="152" font-size="14" fill="#374151">Compara método, dirección</text>
    <text x="22" y="171" font-size="14" fill="#374151">y restricciones, en orden</text>
    <circle cx="905" cy="77" r="13" fill="#DC2626"/><text x="905" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✗</text>
    <circle cx="905" cy="121" r="13" fill="#DC2626"/><text x="905" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✗</text>
  </g>
  <!-- 3 · la primera que coincide -->
  <g>
    <rect x="350" y="146" width="580" height="38" rx="6" fill="none" stroke="#059669" stroke-width="3"/>
    <circle cx="905" cy="165" r="13" fill="#059669"/><text x="905" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">✓</text>
    <path d="M348 165 C 315 165, 315 352, 338 352" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#r-fl-verde)"/>
    <rect x="244" y="240" width="80" height="26" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="284" y="258" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#065F46">$id = 7</text>
    <rect x="340" y="310" width="600" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="355" y="332" font-size="13" fill="#5B21B6">Acción</text>
    <text x="355" y="364" font-size="14" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">function ($id) { return 'Vista detalle proyecto ' . $id; }</text>
    <path d="M340 380 L 304 380" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#r-fl-gris)"/>
    <rect x="20" y="310" width="280" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="35" y="332" font-size="13" fill="#1E40AF">Respuesta 200</text>
    <text x="35" y="368" font-size="17" font-weight="700" fill="#1E3A8A">Vista detalle proyecto 7</text>
  </g>

</svg>
