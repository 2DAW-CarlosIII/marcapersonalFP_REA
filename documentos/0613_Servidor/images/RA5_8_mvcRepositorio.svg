<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="GET /mi-curriculo llega a MiCurriculoController, que solo conoce la interfaz CurriculoRepository y le pide el currículo del usuario 7. El contenedor le entregó un JsonCurriculoRepository, que lee curriculos.json y devuelve un objeto Curriculo con su Ciclo. El controlador pasa los datos a la vista curriculos.mio y el HTML vuelve al navegador. En el Bloque 6, un EloquentCurriculoRepository guardará en la base de datos sin cambiar el controlador" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>GET /mi-curriculo llega a MiCurriculoController, que solo conoce la interfaz CurriculoRepository y le pide el currículo del usuario 7. El contenedor le entregó un JsonCurriculoRepository, que lee curriculos.json y devuelve un objeto Curriculo con su Ciclo. El controlador pasa los datos a la vista curriculos.mio y el HTML vuelve al navegador. En el Bloque 6, un EloquentCurriculoRepository guardará en la base de datos sin cambiar el controlador</title>
  <defs>
    <marker id="r8-fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4B5563"/></marker>
    <marker id="r8-fl-violeta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#7C3AED"/></marker>
    <marker id="r8-fl-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#0D9488"/></marker>
    <marker id="r8-fl-rosa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#DB2777"/></marker>
    <marker id="r8-impl" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="410" rx="14" fill="#F8FAFC"/>

  <!-- Navegador -->
  <rect x="15" y="150" width="120" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="75" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">Navegador</text>

  <!-- Controlador -->
  <rect x="190" y="40" width="240" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="310" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">MiCurriculoController</text>
  <text x="310" y="92" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">edit(): View</text>
  <text x="310" y="118" text-anchor="middle" font-size="12" fill="#5B21B6">pide un CurriculoRepository</text>

  <!-- Vista -->
  <rect x="190" y="300" width="240" height="80" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
  <text x="310" y="331" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#9D174D">curriculos/mio.blade.php</text>
  <text x="310" y="356" text-anchor="middle" font-size="12" fill="#9D174D">nombre · ciclos · vídeo</text>

  <!-- Modelo: la interfaz y sus implementaciones -->
  <rect x="520" y="40" width="260" height="72" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="650" y="60" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">«interface»</text>
  <text x="650" y="80" text-anchor="middle" font-size="14" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#4C1D95">CurriculoRepository</text>
  <text x="650" y="100" text-anchor="middle" font-size="11" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">todos() · delUsuario() · guardar()</text>
  <rect x="470" y="160" width="170" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="555" y="187" text-anchor="middle" font-size="11" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#475569">ArrayCurriculoRepository</text>
  <text x="555" y="207" text-anchor="middle" font-size="11" fill="#64748B">un array: se pierde</text>
  <rect x="660" y="160" width="180" height="60" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="750" y="187" text-anchor="middle" font-size="11" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#115E59">JsonCurriculoRepository</text>
  <text x="750" y="207" text-anchor="middle" font-size="11" fill="#115E59">un fichero JSON</text>
  <path d="M555 160 L 600 114" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r8-impl)"/>
  <path d="M750 160 L 700 114" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#r8-impl)"/>
  <path d="M850 240 L 928 240 L 945 257 L 945 300 L 850 300 Z" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <path d="M928 240 L 928 257 L 945 257" fill="none" stroke="#0D9488" stroke-width="1.5"/>
  <text x="895" y="285" text-anchor="middle" font-size="10.5" font-family="'Source Code Pro', Consolas, monospace" fill="#115E59">curriculos.json</text>

  <!-- 1 · la petición llega al controlador -->
  <g>
    <text x="75" y="138" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">GET /mi-curriculo</text>
    <path d="M135 190 C 160 190, 160 90, 186 90" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#r8-fl-gris)"/>
    <circle cx="178" cy="172" r="12" fill="#2563EB"/><text x="178" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  </g>
  <!-- 2 · el controlador pide a la interfaz -->
  <g>
    <path d="M430 75 L 516 75" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#r8-fl-violeta)"/>
    <text x="473" y="67" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">delUsuario(7)</text>
    <circle cx="473" cy="95" r="12" fill="#7C3AED"/><text x="473" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  </g>
  <!-- 3 · el contenedor entregó el de JSON, que lee el fichero -->
  <g>
    <rect x="658" y="158" width="184" height="64" rx="11" fill="none" stroke="#0D9488" stroke-width="4"/>
    <text x="805" y="148" text-anchor="middle" font-size="11" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#0F766E">singleton()</text>
    <path d="M840 200 C 880 200, 895 210, 895 236" fill="none" stroke="#0D9488" stroke-width="3" marker-end="url(#r8-fl-teal)"/>
    <text x="902" y="222" font-size="12" fill="#115E59">lee</text>
    <circle cx="870" cy="172" r="12" fill="#0D9488"/><text x="870" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  </g>
  <!-- 4 · vuelve un objeto del dominio -->
  <g>
    <circle cx="310" cy="206" r="12" fill="#059669"/><text x="310" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
  </g>
  <g>
    <g transform="translate(-465 -88)">
      <rect x="700" y="240" width="150" height="36" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
      <text x="775" y="263" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#065F46">Curriculo + Ciclo</text>
    </g>
  </g>
  <!-- 5 · la vista y el HTML -->
  <g>
    <path d="M410 140 L 410 296" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#r8-fl-rosa)"/>
    <text x="418" y="236" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#9D174D">curriculo, ciclos</text>
    <path d="M190 340 C 160 340, 160 250, 139 250" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#r8-fl-rosa)"/>
    <text x="148" y="300" text-anchor="end" font-size="12" font-weight="700" fill="#9D174D">HTML</text>
    <circle cx="175" cy="368" r="12" fill="#DB2777"/><text x="175" y="373" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
  </g>
  <!-- 6 · Bloque 6: otra implementación -->
  <g>
    <rect x="470" y="305" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="570" y="328" text-anchor="middle" font-size="11" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#475569">EloquentCurriculoRepository</text>
    <text x="570" y="348" text-anchor="middle" font-size="11" fill="#64748B">Bloque 6</text>
    <path d="M670 333 L 696 333" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#r8-fl-gris)"/>
    <rect x="700" y="310" width="120" height="46" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="760" y="338" text-anchor="middle" font-size="13" fill="#475569">base de datos</text>
    <text x="470" y="390" font-size="13" fill="#475569">Otra implementación y una línea en el contenedor: el controlador no cambia</text>
    <circle cx="455" cy="333" r="12" fill="#64748B"/><text x="455" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
  </g>

</svg>
