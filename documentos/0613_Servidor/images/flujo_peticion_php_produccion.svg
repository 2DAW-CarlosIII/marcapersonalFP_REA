<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" height="100%">
  <defs>
    <!-- Marcadores de flechas auto-orientables -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Fondo general del canvas (gris ultra claro) -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="16" />

  <!-- ==================== LADO CLIENTE (LOCAL) ==================== -->
  <!-- Contenedor: Ordenador del Usuario -->
  <g>
    <!-- Sombra/borde elevado del contenedor -->
    <rect x="24" y="44" width="230" height="340" rx="16" fill="#E2E8F0" />
    <rect x="20" y="40" width="230" height="340" rx="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" />
    <!-- Etiqueta del contenedor -->
    <rect x="40" y="30" width="190" height="24" rx="12" fill="#64748B" />
    <text x="135" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ORDENADOR DEL USUARIO</text>
    <text x="135" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">(Entorno Local)</text>
  </g>

  <!-- Tarjeta: Navegador -->
  <g>
    <!-- Sombra sólida (efecto 3D elevado) -->
    <rect x="49" y="124" width="170" height="190" rx="12" fill="#1E40AF" opacity="0.2" />
    <!-- Tarjeta principal -->
    <rect x="45" y="120" width="170" height="190" rx="12" fill="#F0FDF4" stroke="#3B82F6" stroke-width="2.5" />
    <!-- Barra superior del navegador -->
    <path d="M 45 132 A 12 12 0 0 1 57 120 L 203 120 A 12 12 0 0 1 215 132 L 215 145 L 45 145 Z" fill="#DBEAFE" />
    <!-- Botones navegador -->
    <circle cx="60" cy="132" r="4" fill="#EF4444" />
    <circle cx="72" cy="132" r="4" fill="#F59E0B" />
    <circle cx="84" cy="132" r="4" fill="#10B981" />
    <rect x="100" y="127" width="100" height="10" rx="4" fill="#FFFFFF" />
    <!-- Contenido tarjeta -->
    <text x="130" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#1E40AF" text-anchor="middle">Navegador</text>
    <text x="130" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3B82F6" text-anchor="middle">Cliente / Browser</text>
  </g>


  <!-- ==================== INTERNET ==================== -->
  <!-- Nube/Divisor central de Internet -->
  <g>
    <!-- Línea divisoria central con estilo Internet -->
    <path d="M 335 40 L 335 380" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6" />
    <!-- Globo de Internet -->
    <!-- Sombra -->
    <rect x="282" y="197" width="106" height="36" rx="18" fill="#1E3A8A" opacity="0.15" />
    <!-- Globo principal -->
    <rect x="280" y="195" width="106" height="36" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
    <!-- Icono de Red / Globo terráqueo simplificado -->
    <circle cx="302" cy="213" r="8" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <line x1="294" y1="213" x2="310" y2="213" stroke="#2563EB" stroke-width="1.5" />
    <path d="M 302 205 Q 305 213 302 221 Q 299 213 302 205 Z" fill="none" stroke="#2563EB" stroke-width="1.5" />
    <text x="344" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1E40AF" text-anchor="middle">INTERNET</text>
  </g>


  <!-- ==================== LADO SERVIDOR (REMOTO) ==================== -->
  <!-- Contenedor: Servidor Remoto -->
  <g>
    <!-- Sombra/borde elevado del contenedor -->
    <rect x="424" y="44" width="530" height="340" rx="16" fill="#E2E8F0" />
    <rect x="420" y="40" width="530" height="340" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" />
    <!-- Etiqueta del contenedor -->
    <rect x="585" y="30" width="200" height="24" rx="12" fill="#0F172A" />
    <text x="685" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SERVIDOR REMOTO (PRODUCCIÓN)</text>
    <text x="685" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Hosting / Cloud</text>
  </g>

  <!-- Tarjeta: Nginx (Servidor Web) -->
  <g>
    <!-- Sombra sólida -->
    <rect x="459" y="124" width="170" height="190" rx="12" fill="#047857" opacity="0.2" />
    <!-- Tarjeta principal -->
    <rect x="455" y="120" width="170" height="190" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2.5" />
    <!-- Cabecera -->
    <path d="M 455 132 A 12 12 0 0 1 467 120 L 613 120 A 12 12 0 0 1 625 132 L 625 145 L 455 145 Z" fill="#D1FAE5" />
    <circle cx="470" cy="132" r="3" fill="#10B981" />
    <circle cx="480" cy="132" r="3" fill="#10B981" />
    <!-- Contenido tarjeta -->
    <text x="540" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#065F46" text-anchor="middle">Servidor Web</text>
    <text x="540" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#10B981" text-anchor="middle">nginx</text>
  </g>

  <!-- Tarjeta: php-fpm (Intérprete) -->
  <g>
    <!-- Sombra sólida -->
    <rect x="754" y="124" width="170" height="190" rx="12" fill="#6D28D9" opacity="0.2" />
    <!-- Tarjeta principal -->
    <rect x="750" y="120" width="170" height="190" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2.5" />
    <!-- Cabecera -->
    <path d="M 750 132 A 12 12 0 0 1 762 120 L 908 120 A 12 12 0 0 1 920 132 L 920 145 L 750 145 Z" fill="#EDE9FE" />
    <circle cx="765" cy="132" r="3" fill="#8B5CF6" />
    <circle cx="775" cy="132" r="3" fill="#8B5CF6" />
    <!-- Contenido tarjeta -->
    <text x="835" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">Intérprete PHP</text>
    <text x="835" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#8B5CF6" text-anchor="middle">php-fpm</text>
  </g>


  <!-- ==================== LÍNEAS DE FLUJO Y TEXTOS ==================== -->

  <!-- 1. Petición HTTP (Navegador -> Nginx) pasando por Internet -->
  <g>
    <path d="M 215 170 L 455 170" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)" />
    <rect x="252" y="145" width="116" height="20" rx="10" fill="#DBEAFE" />
    <text x="310" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E40AF" text-anchor="middle">petición HTTP</text>
  </g>

  <!-- 2. Ejecuta el .php (Nginx -> PHP-FPM) -->
  <g>
    <path d="M 625 180 L 750 180" fill="none" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow-gray)" />
    <text x="687" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4B5563" text-anchor="middle">ejecuta .php</text>
  </g>

  <!-- 3. Retorno HTML (PHP-FPM -> Nginx) -->
  <g>
    <path d="M 750 240 L 625 240" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="687" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">retorna HTML</text>
  </g>

  <!-- 4. Respuesta HTTP (Nginx -> Navegador) pasando por Internet -->
  <g>
    <path d="M 455 260 L 215 260" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)" />
    <rect x="252" y="272" width="116" height="20" rx="10" fill="#D1FAE5" />
    <text x="310" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">respuesta HTTP</text>
  </g>

</svg>
