    <text x="725" y="200" font-size="11" fill="#6B7280">2023-02-10 – 2023-06-20</text>
    <text x="725" y="222" font-size="14" font-weight="700" fill="#B91C1C">4.0</text>
    <text x="725" y="240" font-size="11" fill="#1D4ED8">Más información</text>
    <rect x="495" y="258" width="210" height="88" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="505" y="280" font-size="12" font-weight="700" fill="#111827">Electrónica</text>
    <text x="505" y="298" font-size="11" fill="#6B7280">2023-03-05 – 2023-07-15</text>
    <text x="505" y="320" font-size="14" font-weight="700" fill="#15803D">9.2</text>
    <text x="505" y="338" font-size="11" fill="#1D4ED8">Más información</text>
