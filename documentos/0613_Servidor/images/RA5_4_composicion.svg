<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="La página /proyectos se compone por piezas: el layout pone el esqueleto con la barra, el título, el hueco $slot y el pie; el componente navbar rellena la barra; la vista proyectos.index pasa el título y lo que escribe entre x-layout y /x-layout ocupa el $slot; cada x-tarjeta-proyecto se sustituye por su componente" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>La página /proyectos se compone por piezas: el layout pone el esqueleto con la barra, el título, el hueco $slot y el pie; el componente navbar rellena la barra; la vista proyectos.index pasa el título y lo que escribe entre x-layout y /x-layout ocupa el $slot; cada x-tarjeta-proyecto se sustituye por su componente</title>
  <defs>
    <marker id="p-fl-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#3B82F6"/></marker>
    <marker id="p-fl-ambar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#D97706"/></marker>
    <marker id="p-fl-rosa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#DB2777"/></marker>
    <marker id="p-fl-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#059669"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="14" fill="#F8FAFC"/>

  <!-- La página, en el navegador -->
  <rect x="470" y="15" width="470" height="410" rx="10" fill="#F3F4F6" stroke="#94A3B8" stroke-width="2"/>
  <rect x="471" y="16" width="468" height="31" rx="9" fill="#E2E8F0"/>
  <rect x="471" y="36" width="468" height="11" fill="#E2E8F0"/>
  <circle cx="489" cy="31" r="5" fill="#EF4444"/><circle cx="505" cy="31" r="5" fill="#F59E0B"/><circle cx="521" cy="31" r="5" fill="#10B981"/>
  <rect x="540" y="22" width="380" height="18" rx="9" fill="#FFFFFF"/>
  <text x="552" y="36" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#475569">marcapersonalfp.test/proyectos</text>

  <!-- 1 · el layout: el esqueleto -->
  <g>
    <rect x="20" y="15" width="400" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="35" y="36" font-size="13" font-weight="700" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">components/layout.blade.php</text>
    <circle cx="400" cy="33" r="12" fill="#3B82F6"/><text x="400" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="35" y="60" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">&lt;head&gt; … @vite([…]) &lt;/head&gt;</text>
    <text x="35" y="82" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">&lt;x-navbar /&gt;</text>
    <text x="35" y="104" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">&lt;main&gt; &lt;h1&gt;{{ $titulo }}&lt;/h1&gt; {{ $slot }} &lt;/main&gt;</text>
    <text x="35" y="126" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">&lt;footer&gt; {{ config('…centro') }} &lt;/footer&gt;</text>
    <path d="M420 40 L 464 40" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#p-fl-azul)"/>
    <rect x="480" y="55" width="450" height="40" rx="6" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
