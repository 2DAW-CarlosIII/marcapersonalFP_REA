<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-label="El login de v0 paso a paso: un atacante consigue que el navegador de Ana use el identificador abc; Ana envía email y contraseña con esa cookie; el servidor comprueba la contraseña con password_verify, regenera la sesión con un identificador nuevo, xyz, borra abc y responde 303 con la cookie nueva; Ana entra en su área con xyz; el atacante prueba con abc y no le sirve" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>El login de v0 paso a paso: un atacante consigue que el navegador de Ana use el identificador abc; Ana envía email y contraseña con esa cookie; el servidor comprueba la contraseña con password_verify, regenera la sesión con un identificador nuevo, xyz, borra abc y responde 303 con la cookie nueva; Ana entra en su área con xyz; el atacante prueba con abc y no le sirve</title>
  <defs>
    <marker id="a42l-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#2563EB"/></marker>
    <marker id="a42l-ambar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#D97706"/></marker>
    <marker id="a42l-rojo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#DC2626"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" rx="14" fill="#F8FAFC"/>

  <!-- Navegador de Ana -->
  <rect x="20" y="20" width="230" height="270" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="135" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#1E40AF">Navegador de Ana</text>
  <text x="135" y="74" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">ana.lopez@…</text>
  <text x="135" y="225" text-anchor="middle" font-size="13" fill="#1E40AF">Su cookie de sesión:</text>

  <!-- Atacante -->
  <rect x="20" y="320" width="230" height="120" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="135" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#991B1B">Atacante</text>
  <text x="135" y="374" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#991B1B">conoce PHPSESSID=abc</text>

  <!-- Servidor -->
  <rect x="640" y="20" width="300" height="420" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="790" y="50" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Servidor</text>
  <rect x="660" y="250" width="260" height="105" rx="10" fill="#fff" stroke="#C4B5FD"/>
  <text x="790" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">Sesiones guardadas</text>

  <!-- 1 · El atacante fija el identificador -->
  <g>
    <path d="M135 320 L 135 274" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a42l-rojo)"/>
    <circle cx="160" cy="298" r="12" fill="#DC2626"/><text x="160" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="135" y="400" text-anchor="middle" font-size="12" fill="#991B1B">le hace usar ese identificador</text>
    <text x="135" y="418" text-anchor="middle" font-size="12" fill="#991B1B">(un enlace preparado…)</text>
  </g>
  <!-- 2 · POST de las credenciales -->
  <g>
    <text x="445" y="72" text-anchor="middle" font-size="14" fill="#1E40AF">POST email + contraseña</text>
    <path d="M255 82 L 635 82" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#a42l-azul)"/>
    <text x="445" y="100" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#B91C1C">Cookie: PHPSESSID=abc</text>
    <circle cx="275" cy="64" r="12" fill="#2563EB"/><text x="275" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  </g>
  <!-- 3 · password_verify -->
  <g>
    <circle cx="672" cy="86" r="12" fill="#059669"/><text x="672" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="692" y="91" font-size="14" font-family="'Source Code Pro', Consolas, monospace" fill="#047857">password_verify() ✓</text>
  </g>
  <!-- 4 · session_regenerate_id -->
  <g>
    <circle cx="672" cy="120" r="12" fill="#D97706"/><text x="672" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="692" y="125" font-size="14" font-family="'Source Code Pro', Consolas, monospace" fill="#B45309">session_regenerate_id(true)</text>
    <text x="680" y="303" font-size="14" font-family="'Source Code Pro', Consolas, monospace" fill="#047857">xyz → usuario: Ana</text>
    <text x="680" y="330" font-size="13" fill="#B91C1C">abc: borrada</text>
  </g>
  <!-- 5 · 303 con la cookie nueva -->
  <g>
    <text x="445" y="142" text-anchor="middle" font-size="14" fill="#B45309">303 → RA4_perfil.php</text>
    <path d="M635 152 L 255 152" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#a42l-ambar)"/>
    <text x="445" y="170" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#B45309">Set-Cookie: PHPSESSID=xyz</text>
    <circle cx="615" cy="134" r="12" fill="#D97706"/><text x="615" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text>
    <rect x="40" y="235" width="190" height="34" rx="17" fill="#fff" stroke="#059669" stroke-width="2"/>
    <text x="135" y="257" text-anchor="middle" font-size="14" font-family="'Source Code Pro', Consolas, monospace" fill="#047857">PHPSESSID=xyz</text>
  </g>
  <!-- 6 · Ana entra en su área -->
  <g>
    <text x="445" y="207" text-anchor="middle" font-size="14" fill="#1E40AF">GET RA4_perfil.php</text>
    <path d="M255 217 L 635 217" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#a42l-azul)"/>
    <text x="445" y="235" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#047857">Cookie: PHPSESSID=xyz</text>
    <circle cx="275" cy="199" r="12" fill="#2563EB"/><text x="275" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text>
    <text x="672" y="200" font-size="14" font-family="'Source Code Pro', Consolas, monospace" fill="#047857">exigirLogin() ✓</text>
    <text x="672" y="222" font-size="13" fill="#047857">→ Mi área de Ana</text>
  </g>
  <!-- 7 · El atacante prueba con abc -->
  <g>
    <text x="445" y="375" text-anchor="middle" font-size="14" fill="#991B1B">GET RA4_perfil.php</text>
    <path d="M255 385 L 635 385" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#a42l-rojo)"/>
    <text x="445" y="403" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#B91C1C">Cookie: PHPSESSID=abc</text>
    <circle cx="275" cy="367" r="12" fill="#DC2626"/><text x="275" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7</text>
    <text x="672" y="392" font-size="14" font-weight="700" fill="#B91C1C">✗ abc no existe</text>
    <text x="672" y="414" font-size="13" fill="#B91C1C">→ redirige al login</text>
  </g>

</svg>
