<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-label="Antes, la función de la ruta tenía los datos y elegía la vista. Los datos pasan a una propiedad de ProyectosController y la vista a su acción show. La ruta solo apunta al controlador. Después, GET /proyectos/show/7 llega a la ruta, la ruta llama a show con el 7, show toma el proyecto de $arrayProyectos y devuelve la vista proyectos.show" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>Antes, la función de la ruta tenía los datos y elegía la vista. Los datos pasan a una propiedad de ProyectosController y la vista a su acción show. La ruta solo apunta al controlador. Después, GET /proyectos/show/7 llega a la ruta, la ruta llama a show con el 7, show toma el proyecto de $arrayProyectos y devuelve la vista proyectos.show</title>
  <defs>
    <marker id="k-fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4B5563"/></marker>
    <marker id="k-fl-violeta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#7C3AED"/></marker>
    <marker id="k-fl-rosa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#DB2777"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="410" rx="14" fill="#F8FAFC"/>

  <!-- routes/web.php, antes -->
  <rect x="20" y="100" width="440" height="200" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="35" y="124" font-size="13" font-weight="700" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">routes/web.php</text>
  <text x="35" y="152" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">Route::get('proyectos/show/{id}', function ($id) {</text>
  <text x="50" y="176" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">$proyectos =</text>
  <text x="35" y="288" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">});</text>

  <!-- 1 · antes: la función lo hace todo -->
  <g>
    <rect x="20" y="20" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <text x="35" y="38" font-size="12" fill="#1E40AF">Petición</text>
    <text x="35" y="62" font-size="16" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">GET /proyectos/show/7</text>
    <path d="M170 72 L 170 96" fill="none" stroke="#4B5563" stroke-width="3" marker-end="url(#k-fl-gris)"/>
    <circle cx="195" cy="86" r="13" fill="#2563EB"/><text x="195" y="91" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <rect x="200" y="330" width="560" height="60" rx="10" fill="#FDF2F8" stroke="#DB2777" stroke-width="2"/>
    <text x="480" y="356" text-anchor="middle" font-size="14" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#9D174D">resources/views/proyectos/show.blade.php</text>
    <text x="480" y="378" text-anchor="middle" font-size="13" fill="#9D174D">la vista de 5.4 → HTML</text>
    <path d="M240 300 L 240 326" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#k-fl-rosa)"/>
  </g>
  <!-- 2 · los datos y la vista, al controlador -->
  <g>
    <rect x="520" y="100" width="420" height="200" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <text x="535" y="124" font-size="13" font-weight="700" font-family="'Source Code Pro', Consolas, monospace" fill="#5B21B6">ProyectosController.php</text>
    <circle cx="915" cy="120" r="13" fill="#7C3AED"/><text x="915" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
    <text x="535" y="152" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">private array $arrayProyectos =</text>
    <text x="535" y="222" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">public function show(int $id): View {</text>
    <text x="535" y="288" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#4C1D95">}</text>
  </g>
  <!-- 3 · la ruta solo apunta -->
  <g>
    <rect x="23" y="134" width="434" height="163" fill="#EFF6FF"/>
    <text x="35" y="160" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">Route::get('proyectos/show/{id}',</text>
    <text x="66" y="185" font-size="13" font-family="'Source Code Pro', Consolas, monospace" font-weight="700" fill="#5B21B6">[ProyectosController::class, 'show']</text>
    <text x="35" y="210" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E3A8A">)-&gt;whereNumber('id')-&gt;name('proyectos.show');</text>
    <text x="35" y="262" font-size="14" fill="#1E40AF">Un índice: dirección → acción</text>
    <rect x="225" y="301" width="30" height="28" fill="#F8FAFC"/>
    <path d="M460 185 C 490 185, 490 217, 516 217" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#k-fl-violeta)"/>
    <circle cx="488" cy="160" r="13" fill="#7C3AED"/><text x="488" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  </g>
  <!-- 4 · después: el flujo completo -->
  <g>
    <text x="545" y="85" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#5B21B6">show(7) → $arrayProyectos[7]</text>
    <path d="M730 300 L 730 326" fill="none" stroke="#DB2777" stroke-width="3" marker-end="url(#k-fl-rosa)"/>
    <text x="742" y="318" font-size="13" fill="#9D174D">proyecto + id</text>
    <circle cx="710" cy="313" r="13" fill="#DB2777"/><text x="710" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
  </g>

  <!-- Los datos y la vista: viajan de la ruta al controlador -->
  <g transform="translate(500 -24)">
    <rect x="50" y="184" width="380" height="36" rx="6" fill="#D1FAE5" stroke="#059669"/>
    <text x="62" y="207" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#064E3B">[ ['nombre' =&gt; 'Tecnologías…', …], … ];</text>
  </g>
  <g transform="translate(500 2)">
    <rect x="50" y="230" width="380" height="36" rx="6" fill="#FCE7F3" stroke="#DB2777"/>
    <text x="62" y="253" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#831843">return view('proyectos.show', [ … ]);</text>
  </g>

</svg>
