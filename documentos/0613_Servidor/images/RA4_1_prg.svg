<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="El navegador envía el alta por POST; el script la valida, guarda el currículo y un mensaje en la sesión y responde 303 con la cabecera Location, sin HTML. El navegador pide el listado con GET; el script lee el mensaje de la sesión, lo borra y lo muestra. Si el usuario pulsa F5, solo se repite el GET: el formulario no se reenvía y el mensaje ya no aparece" font-family="'Source Sans Pro', Helvetica, Arial, sans-serif">
  <title>El navegador envía el alta por POST; el script la valida, guarda el currículo y un mensaje en la sesión y responde 303 con la cabecera Location, sin HTML. El navegador pide el listado con GET; el script lee el mensaje de la sesión, lo borra y lo muestra. Si el usuario pulsa F5, solo se repite el GET: el formulario no se reenvía y el mensaje ya no aparece</title>
  <defs>
    <marker id="p41-fl-gris" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4B5563"/></marker>
    <marker id="p41-fl-azul" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#2563EB"/></marker>
    <marker id="p41-fl-ambar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#D97706"/></marker>
    <marker id="p41-fl-verde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#059669"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="340" rx="14" fill="#F8FAFC"/>

  <!-- Participantes y líneas de vida -->
  <rect x="45" y="12" width="190" height="44" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="140" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#1E3A8A">Navegador</text>
  <rect x="330" y="12" width="340" height="44" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="500" y="31" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">Servidor</text>
  <text x="500" y="49" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#5B21B6">RA4_altaCurriculo.php · RA4_curriculos.php</text>
  <rect x="745" y="12" width="190" height="44" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="840" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#065F46" font-family="'Source Code Pro', Consolas, monospace">$_SESSION</text>
  <path d="M140 56 L 140 332" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M500 56 L 500 332" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M840 56 L 840 332" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- 1 · POST: el alta, válida, a la sesión -->
  <g>
    <circle cx="24" cy="82" r="12" fill="#7C3AED"/><text x="24" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="320" y="76" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#374151">POST RA4_altaCurriculo.php</text>
    <path d="M140 82 L 496 82" stroke="#4B5563" stroke-width="2.5" marker-end="url(#p41-fl-gris)"/>
    <text x="512" y="87" font-size="13" font-weight="700" fill="#047857">válido ✓</text>
    <text x="670" y="102" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#065F46">curriculos[] + mensaje</text>
    <path d="M500 108 L 836 108" stroke="#059669" stroke-width="2.5" marker-end="url(#p41-fl-verde)"/>
  </g>
  <!-- 2 · 303 sin HTML -->
  <g>
    <circle cx="24" cy="134" r="12" fill="#D97706"/><text x="24" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="320" y="128" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#B45309">303 · Location: RA4_curriculos.php</text>
    <path d="M500 134 L 144 134" stroke="#D97706" stroke-width="2.5" marker-end="url(#p41-fl-ambar)"/>
    <text x="512" y="139" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#92400E">exit: sin HTML</text>
  </g>
  <!-- 3 · GET: el listado lee el mensaje y lo borra -->
  <g>
    <circle cx="24" cy="172" r="12" fill="#2563EB"/><text x="24" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="320" y="166" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#374151">GET RA4_curriculos.php</text>
    <path d="M140 172 L 496 172" stroke="#4B5563" stroke-width="2.5" marker-end="url(#p41-fl-gris)"/>
    <text x="670" y="192" text-anchor="middle" font-size="12" font-family="'Source Code Pro', Consolas, monospace" fill="#065F46">mensaje · y unset()</text>
    <path d="M840 198 L 504 198" stroke="#059669" stroke-width="2.5" marker-end="url(#p41-fl-verde)"/>
    <text x="320" y="218" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">200 · listado con el mensaje</text>
    <path d="M500 224 L 144 224" stroke="#2563EB" stroke-width="2.5" marker-end="url(#p41-fl-azul)"/>
  </g>
  <!-- 4 · F5: solo se repite el GET -->
  <g>
    <circle cx="24" cy="262" r="12" fill="#64748B"/><text x="24" y="267" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="320" y="256" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#374151">F5 · GET RA4_curriculos.php</text>
    <path d="M140 262 L 496 262" stroke="#4B5563" stroke-width="2.5" marker-end="url(#p41-fl-gris)"/>
    <text x="670" y="282" text-anchor="middle" font-size="12" fill="#065F46">ya no hay mensaje</text>
    <path d="M840 288 L 504 288" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#p41-fl-verde)"/>
    <text x="320" y="308" text-anchor="middle" font-size="13" font-family="'Source Code Pro', Consolas, monospace" fill="#1E40AF">200 · listado, sin mensaje</text>
    <path d="M500 314 L 144 314" stroke="#2563EB" stroke-width="2.5" marker-end="url(#p41-fl-azul)"/>
  </g>

</svg>
